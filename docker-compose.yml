services:
  objecttalk:
    build: .
    image: objecttalk:latest
    ports:
      - '8787:8787'
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8787
      DATA_DIR: /data
    volumes:
      - objecttalk-data:/data
    restart: unless-stopped

volumes:
  objecttalk-data:
